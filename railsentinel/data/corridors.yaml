# Corridors used by the digital twin to generate its synthetic timetable.
#
# Stations and their coordinates are real (see stations.csv, datameet CC0).
# The trains generated on these corridors are SYNTHETIC: numbers use the
# "RS" prefix so they never collide with real Indian Railways train numbers,
# and their timings, fares and delays come from the twin's simulator.
#
# Each corridor lists its stops in order and how many trains of each
# category to generate per direction.

